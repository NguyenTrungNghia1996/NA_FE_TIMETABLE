stages:
  - docker

variables:
  # Docker configuration
  DOCKER_DRIVER: overlay2
  DOCKER_TLS_CERTDIR: "/certs"
  DOCKER_BUILDKIT: 1  # Enable Docker BuildKit
  
  # Registry configuration
  CI_REGISTRY: registry.nguyenanh-est.com
  CI_REGISTRY_URL: https://registry.nguyenanh-est.com
  IMAGE_NAME: "$CI_REGISTRY/$CI_PROJECT_PATH"
  IMAGE_TAG: "$IMAGE_NAME:$CI_COMMIT_SHORT_SHA"
  TIMESTAMP: $(date +%Y%m%d-%H%M%S)

docker-build-and-push:
  stage: docker
  image: docker:24.0  # Use specific version instead of latest
  services:
    - docker:24.0-dind  # Match Docker client version
  
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
      when: never
    - if: '$CI_COMMIT_BRANCH == "deploy" && $CI_MERGE_REQUEST_STATE == "merged"'
      when: on_success
    - if: '$CI_COMMIT_BRANCH == "deploy" && $CI_PIPELINE_SOURCE == "push"'
      when: on_success
  
  before_script:
    - echo "$CI_REGISTRY_PASSWORD" | docker login -u "$CI_REGISTRY_USER" --password-stdin $CI_REGISTRY
  
  script:
    - |
      set -ex  # Enable debug mode and exit on error
      
      # Define all image tags
      TAG_LATEST="latest"
      TAG_SHA="$CI_COMMIT_SHORT_SHA"
      TAG_BRANCH="$CI_COMMIT_REF_NAME-$CI_PIPELINE_ID"
      TAG_TIMESTAMP="$TIMESTAMP"
      TAG_VERSION="${CI_COMMIT_TAG:-$CI_COMMIT_REF_NAME}"  # Use tag if available, otherwise branch name

      echo "Building Docker image with tags:"
      echo "- $TAG_LATEST"
      echo "- $TAG_SHA"
      echo "- $TAG_BRANCH"
      echo "- $TAG_TIMESTAMP"
      echo "- $TAG_VERSION"

      # Build with cache and pull fresh base images
      docker buildx build \
        --pull \
        --progress plain \
        --build-arg BUILD_DATE=$(date -u +"%Y-%m-%dT%H:%M:%SZ") \
        --build-arg VCS_REF=$CI_COMMIT_SHORT_SHA \
        -t $IMAGE_NAME:$TAG_LATEST \
        -t $IMAGE_NAME:$TAG_SHA \
        -t $IMAGE_NAME:$TAG_BRANCH \
        -t $IMAGE_NAME:$TAG_TIMESTAMP \
        -t $IMAGE_NAME:$TAG_VERSION \
        .

      # Push all tags
      docker push $IMAGE_NAME:$TAG_LATEST
      docker push $IMAGE_NAME:$TAG_SHA
      docker push $IMAGE_NAME:$TAG_BRANCH
      docker push $IMAGE_NAME:$TAG_TIMESTAMP
      docker push $IMAGE_NAME:$TAG_VERSION
  
  after_script:
    - |
      # Cleanup images
      docker rmi \
        $IMAGE_NAME:$TAG_LATEST \
        $IMAGE_NAME:$TAG_SHA \
        $IMAGE_NAME:$TAG_BRANCH \
        $IMAGE_NAME:$TAG_TIMESTAMP \
        $IMAGE_NAME:$TAG_VERSION || true
      docker system prune -af --volumes
    - docker logout $CI_REGISTRY
  
  # Add resource limits
  resources:
    limits:
      memory: "4G"
    requests:
      memory: "2G"
  
  # Add cache configuration
  cache:
    key: docker-cache
    paths:
      - .docker-cache/